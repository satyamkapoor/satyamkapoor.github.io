<!-- Privacy-friendly analytics by Umami -->
<script defer src="https://cloud.umami.is/script.js" data-website-id="fa7a699d-c053-40a7-b69c-b3bbf52dc217"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  var bar = document.createElement('div');
  bar.id = 'reading-progress-bar';
  var inner = document.createElement('div');
  inner.id = 'reading-progress';
  bar.appendChild(inner);
  document.body.insertBefore(bar, document.body.firstChild);

  window.addEventListener('scroll', function() {
    var docHeight = document.documentElement.scrollHeight - window.innerHeight;
    if (docHeight <= 0) return;
    inner.style.width = Math.min((window.scrollY / docHeight) * 100, 100) + '%';
  }, { passive: true });
});
</script>
